name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            このPRの変更内容をレビューし、以下の観点で分析結果をまとめてください：
            - バグや論理的な問題
            - セキュリティ上の懸念
            - パフォーマンスの問題
            - コードの品質・可読性
            - ベストプラクティスへの準拠

            レビューが完了したら、以下の手順でPRにコメントを投稿してください：
            1. レビュー内容を review-output.md というファイルに保存する（Write ツールを使用）
            2. 以下のコマンドで投稿する：
               gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file review-output.md
          settings: |
            {
              "permissions": {
                "allow": [
                  "Write",
                  "Bash(gh pr comment*)",
                  "Bash(gh pr diff*)",
                  "Bash(gh pr view*)",
                  "Read",
                  "Glob",
                  "Grep"
                ]
              }
            }
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
